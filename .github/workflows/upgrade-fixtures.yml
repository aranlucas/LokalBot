# Builds upgrade fixtures from real, signed releases on clean hosted Macs.
# Never run locally: it writes the app's real defaults domain and Keychain.
name: Upgrade fixtures

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated releases"
        default: "0.6.2 0.7.2 0.8.5 0.9.0 0.9.1 0.9.2"
  pull_request:
    paths:
      - "Scripts/upgrade-fixtures/**"
      - ".github/workflows/upgrade-fixtures.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Fixture ${{ matrix.version }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["0.6.2", "0.7.2", "0.8.5", "0.9.0", "0.9.1", "0.9.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/upgrade-fixtures/generate.sh "${{ matrix.version }}" ".build/upgrade/${{ matrix.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upgrade-fixture-${{ matrix.version }}
          path: .build/upgrade/${{ matrix.version }}
          retention-days: 14
