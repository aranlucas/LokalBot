# Nightly, non-blocking checks: model drift against the preset remote models,
# the real-Parakeet day-in-the-life run, and scale/concurrency. Never a
# required check. Failures open or update an issue.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which nightly jobs to run"
        type: choice
        options: [all, model-drift, day-in-the-life, scale]
        default: all
  pull_request:
    paths:
      - "Scripts/ci/model-drift-models.json"
      - "LokalBotTests/Support/SyntheticModelPrompts.swift"
      - "LokalBotTests/ModelRecordingTests.swift"
      - ".github/workflows/nightly.yml"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      cache_mode: warm

  model-drift:
    name: Model drift
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'model-drift'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unit-products
          path: .build/transfer
      - name: Verify and restore compiled tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack unit
      - name: Record fresh responses
        env:
          TEST_RUNNER_LOKALBOT_RECORD_MODELS: "1"
          TEST_RUNNER_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEST_RUNNER_LOKALBOT_RECORDINGS_OUT: ${{ github.workspace }}/.build/model-recordings
        run: |
          export TEST_RUNNER_LOKALBOT_RECORD_MODEL_IDS="$(python3 -c 'import json; print(",".join(json.load(open("Scripts/ci/model-drift-models.json"))["models"]))')"
          runs=(.build/dd/Build/Products/*.xctestrun)
          xcodebuild test-without-building -xctestrun "${runs[0]}" \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -only-testing:LokalBotTests/ModelRecordingTests
      - name: Compare with committed recordings
        id: compare
        run: python3 Scripts/ci/model-drift.py LokalBotTests/Fixtures/model-recordings .build/model-recordings --report .build/model-recordings/drift.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: model-recordings
          path: .build/model-recordings
          retention-days: 30
      - name: Open or update the drift issue
        if: steps.compare.outputs.drift == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Model drift detected by the nightly run"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file .build/model-recordings/drift.md
          else
            gh issue create --title "$title" --body-file .build/model-recordings/drift.md
          fi
