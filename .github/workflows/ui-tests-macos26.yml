# The UI suite on macOS 26 with Xcode 26.4.1, alongside the required macOS 15
# run in ui-tests.yml. Its checks are not branch-protection or release gates:
# known macOS 26 layout, contrast and timing differences still fail here.
# Until they are fixed it runs weekly and on demand, not on every pull request
# and push: in the week to 2026-10-07 it took 18% of all macOS job time (29
# runs, 2 green) and competed with the required gates for macOS 26 runners.
# Run it for a branch with `gh workflow run ui-tests-macos26.yml --ref BRANCH`.
# Restore the pull_request and push triggers, and make it required, once the
# known failures are fixed.

name: UI Tests (macOS 26)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, an hour after the macOS 15 run

concurrency:
  group: ui-tests-macos26-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos26:
    name: macOS 26
    uses: ./.github/workflows/ui-tests.yml
    with:
      runner: macos-26
      xcode: "26.4.1"
