version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows/ current.
  # One grouped pull request per ecosystem and week: every Dependabot merge
  # starts the full master pipeline, and five single-package bumps on
  # 2026-10-07 started it five times.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Swift Package Manager dependencies. project.yml (XcodeGen) declares them;
  # Dependabot updates the committed
  # LokalBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
